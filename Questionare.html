<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="quiz">
        <div class="quiz-box">
            <h1>Find Your Movie</h1>
            <div class="question">
                <h2>1. What do you want from a movie?</h2>
                <label>
                    <input type="radio" name="q1" value="action">
                    Excitement and action
                </label>
                <label>
                    <input type="radio" name="q1" value="comedy">
                    Something funny
                </label>
                <label>
                    <input type="radio" name="q1" value="horror">
                    Something scary
                </label>
                <label>
                    <input type="radio" name="q1" value="scifi">
                    Something futuristic
                </label>
            </div>
            <div class="question">
                <h2>2. Where would you rather watch a movie?</h2>
                <label>
                    <input type="radio" name="q2" value="action">
                    A battlefield
                </label>
                <label>
                    <input type="radio" name="q2" value="comedy">
                    A crazy party
                </label>
                <label>
                    <input type="radio" name="q2" value="horror">
                    A haunted house
                </label>
                <label>
                    <input type="radio" name="q2" value="scifi">
                    Another planet
                </label>
            </div>
            <div class="question">
                <h2>3. What sounds most interesting?</h2>
                <label>
                    <input type="radio" name="q3" value="action">
                    A huge fight
                </label>
                <label>
                    <input type="radio" name="q3" value="comedy">
                    A ridiculous situation
                </label>
                <label>
                    <input type="radio" name="q3" value="horror">
                    A mysterious disappearance
                </label>
                <label>
                    <input type="radio" name="q3" value="scifi">
                    Discovering alien life
                </label>
            </div>
            <div class="question">
                <h2>4. How intense should the movie be?</h2>
                <label>
                    <input type="radio" name="q4" value="action">
                    Very intense
                </label>
                <label>
                    <input type="radio" name="q4" value="comedy">
                    Not too serious
                </label>
                <label>
                    <input type="radio" name="q4" value="horror">
                    Extremely scary
                </label>
                <label>
                    <input type="radio" name="q4" value="scifi">
                    Mysterious and interesting
                </label>
            </div>
            <div class="question">
                <h2>5. Pick a movie experience</h2>
                <label>
                    <input type="radio" name="q5" value="action">
                    Non-stop entertainment
                </label>
                <label>
                    <input type="radio" name="q5" value="comedy">
                    Laughing with friends
                </label>
                <label>
                    <input type="radio" name="q5" value="horror">
                    Being scared
                </label>
                <label>
                    <input type="radio" name="q5" value="scifi">
                    Getting lost in another world
                </label>
            </div>
            <button id="submitBtn" type="button">
                Find My Movie
            </button>
        </div>
    </main>
    <script src="questscript.js"></script>
</body>
</html>
